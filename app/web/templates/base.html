<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{% block title %}{{ app_name }} — Bot Telegram Multi Fungsi{% endblock %}</title>
  <meta name="description" content="PallBot — Bot Telegram multi fungsi × Website: cek ID, buat channel & grup, AI Chat, panel admin." />
  <meta name="theme-color" content="#0e1621" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="https://giffiles.alphacoders.com/916/91683.gif" onerror="this.href='/static/icons/icon-192.png'" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PallBot" />
</head>
<body>
  <!-- Loading screen -->
  <div id="loader" class="loader">
    <div class="loader-box">
      <img class="loader-gif"
           src="https://i.pinimg.com/originals/77/50/68/7750681fb60b2c2921907b26fabb5c4d.gif"
           alt="Loading" onerror="this.style.display='none'" />
      <div class="loader-spinner"><span></span><span></span><span></span></div>
      <div class="loader-text">Memuat {{ app_name }}...</div>
    </div>
  </div>
  <script>
  (function () {
    var done = false;
    function hide() {
      if (done) return; done = true;
      var l = document.getElementById('loader');
      if (!l) return;
      l.classList.add('hide');
      setTimeout(function () { l.remove(); }, 700);
    }
    window.addEventListener('load', function () { setTimeout(hide, 350); });
    setTimeout(hide, 3000); // safety net
  })();
  </script>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand">
        <img class="nav-logo"
             src="https://giffiles.alphacoders.com/916/91683.gif"
             alt="PallBot" onerror="this.remove()" />
        <b>Pall</b>Bot
      </a>
      <div class="nav-links">
        <a href="/">Beranda</a>
        <a href="/cekid">Cek ID</a>
        <a href="/ai">AI Chat</a>
        <a href="/admin" class="btn btn-small btn-outline">⚙️ Admin</a>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      🤖 <b>{{ app_name }}</b> — Bot Telegram multi fungsi × Website &nbsp;•&nbsp; Dibuat oleh <b>Pall</b>
      &nbsp;•&nbsp; <span class="muted">Install sebagai aplikasi: menu browser → "Tambah ke Layar Utama"</span>
    </div>
  </footer>
  <script src="/static/app.js"></script>
  <script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/static/sw.js').catch(function () {});
    });
  }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
