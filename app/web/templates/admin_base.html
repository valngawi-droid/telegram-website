{% extends "base.html" %}
{% block title %}{{ title }} — Admin {{ app_name }}{% endblock %}
{% block content %}
<div class="admin-head">
  <h1>⚙️ {{ title }}</h1>
  <div class="admin-tabs">
    <a href="/admin" class="{% if active == 'dash' %}active{% endif %}">Dashboard</a>
    <a href="/admin/buat" class="{% if active == 'buat' %}active{% endif %}">Buat Channel</a>
    <a href="/admin/channels" class="{% if active == 'ch' %}active{% endif %}">Daftar Channel</a>
    <a href="/admin/member" class="{% if active == 'member' %}active{% endif %}">Member</a>
    <a href="/admin/pengaturan" class="{% if active == 'set' %}active{% endif %}">Pengaturan</a>
    <a href="/admin/cekeluar" class="logout">Keluar</a>
  </div>
</div>
{% block admin %}{% endblock %}
{% endblock %}
